<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WhisperX · Задачи</title>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<header>
  <span class="brand"><i id="lamp"></i><h1>Servim</h1></span>
  <span class="grow"></span>
  <span class="ver" id="hmodel">—</span>
  <span class="ver" id="hdiar">—</span>
  <span class="ver" id="hq"></span>
</header>

<div class="wrap">
  <div class="card" id="card">
    <h2>Задачи <span class="sub2" id="hsub">загрузка…</span>
      <span class="ver" id="vcopy" title="версия сервиса"></span></h2>

    <!-- ================================ панель инструментов -->
    <div class="tools">
      <button class="tbtn pri" id="add" title="Добавить файлы в очередь (можно перетащить на таблицу)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>Добавить</span></button>
      <input type="file" id="f" multiple hidden accept="audio/*,video/*,.wav,.mp3,.ogg,.m4a,.flac,.aac,.opus,.mp4,.mkv,.webm,.mov">

      <button class="tbtn pri" id="start" disabled title="Запустить обработку очереди">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>
        <span>Старт</span></button>

      <button class="tbtn stop" id="stop" disabled title="Остановить очередь и прервать текущую задачу">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        <span>Стоп</span></button>

      <span class="sep"></span>

      <button class="tbtn danger" id="del" disabled title="Удалить отмеченные задачи (с запросом)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
        <span>Удалить<span id="ndel"></span></span></button>
      <button class="tbtn" id="selpall" title="Отметить все задачи"><span>Выделить все</span></button>
      <button class="tbtn" id="selnone" title="Снять все отметки"><span>Снять выделение</span></button>

      <span class="sep"></span>

      <button class="tbtn" data-flag="diarize" aria-pressed="true" title="Диаризация спикеров (pyannote 3.1)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8ZM4 21a8 8 0 0 1 16 0"/></svg>
        <span>Диаризация</span></button>
      <button class="tbtn" data-flag="vad_filter" aria-pressed="true" title="VAD — пропуск тишины (silero)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h3l3-7 3 14 3-11 2 4h4"/></svg>
        <span>VAD</span></button>
      <button class="tbtn" data-flag="word_timestamps" aria-pressed="true" title="Таймкоды слов (pápka)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></svg>
        <span>Таймкоды</span></button>

      <span class="sep"></span>
      <select id="model" title="модель"></select>
      <select id="lang" title="язык">
        <option value="">язык: авто</option><option value="ru">русский</option>
        <option value="en">английский</option><option value="uk">украинский</option>
        <option value="zh">китайский</option><option value="de">немецкий</option>
        <option value="fr">французский</option><option value="tr">турецкий</option>
      </select>
      <select id="maxs" title="максимум спикеров"><option>спикеров ≤ 2</option><option selected>спикеров ≤ 4</option>
        <option>спикеров ≤ 8</option><option>спикеров ≤ 16</option></select>
      <span class="count" id="cnt">—</span>
    </div>

    <div class="mob-sel">
      <select data-mirror="model"></select><select data-mirror="lang"></select><select data-mirror="maxs"></select>
    </div>

    <!-- ==================================================== таблица -->
    <div class="tw" id="tw" style="--rows:5">
      <table>
        <thead><tr>
          <th class="c-st"><label class="ck" title="выделить все"><input type="checkbox" id="all" aria-label="выделить все"></label></th>
          <th class="c-file">Файл</th>
          <th class="c-type">Тип</th>
          <th class="c-dur">Длит.</th>
          <th class="c-spk">Спикеров</th>
        </tr></thead>
        <tbody id="tb"><tr><td colspan="6" class="empty">загрузка…</td></tr></tbody>
      </table>
    </div>

    <!-- ============================ результат: модальное окно (двойной клик по строке) -->
    <div class="mask" id="mask" hidden>
      <div class="res" id="res" role="dialog" aria-modal="true" aria-labelledby="rt">
        <h3><span id="rt">Результат</span> <span class="ver" id="rm"></span>
          <button class="close" id="rclose">закрыть</button></h3>
        <div class="segs" id="segs"></div>
        <div class="rf">
          <span class="spk" id="spk"></span>
          <span class="gr"></span>
          <label class="dlab" for="fmt">скачать</label>
          <select id="fmt" aria-label="формат файла"></select>
          <button class="go" id="dl">скачать</button>
        </div>
      </div>
    </div>

    <div class="tip">
      <span>перетащи файл на таблицу</span>
      <span>двойной клик по строке — открыть результат</span>
      <span><kbd>Del</kbd> — удалить выбранное</span>
      <span id="mh" style="display:none">долгое нажатие — удалить</span>
      <span id="keepnote" class="mut">аудио не храним: после удаления результата файл нужно загрузить заново</span>
    </div>
  </div>
</div>

<script src="./app.js"></script>
  <!-- ============================ подтверждение удаления (свой диалог, не confirm) -->
  <div class="mask" id="askmask" hidden>
    <div class="ask" role="alertdialog" aria-modal="true" aria-labelledby="askt">
      <h4 id="askt">Удалить?</h4><p id="askx"></p>
      <div class="acts"><button class="g" id="askno">Отмена</button><button class="d" id="askyes">Удалить</button></div>
    </div>
  </div>
</body>
</html>
